name: eggcheck
description: "Aplikasi deteksi kelayakan telur ayam ras berbasis CNN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.1
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  permission_handler: ^11.4.0
  path_provider: ^2.1.3
  google_fonts: ^6.3.2
  http: ^1.6.0   

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_telur.tflite
    - assets/models/class_dict.csv
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/egg_mascot.png"
  min_sdk_android: 21